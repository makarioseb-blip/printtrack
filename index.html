<style>
:root{--bg:#eef2f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5eaf3;--soft:#f1f5f9;--brand:#1e3a8a;--acc:#4f46e5;--g:#059669;--b:#e11d48;--w:#d97706;--r:16px;--sh:0 1px 2px rgba(15,23,42,.05),0 10px 26px -12px rgba(15,23,42,.16)}

*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}
button,input,select,textarea{font:inherit;font-size:14px}

.btn.l{background:var(--soft);color:var(--ink)}.btn.g{background:var(--g)}.btn.r{background:#fff1f2;color:#be123c}.btn.gh{background:rgba(255,255,255,.2)}.btn.sm{padding:4px 10px;font-size:12px;border-radius:9px}
.tabs{margin-top:-38px;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:5px;display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}

.al span{flex:1}

.tag.m{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}.tag.late{background:#fff1f2;color:#be123c;border-color:#fecdd3}.tag.ok{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.pipe{display:flex;gap:5px;align-items:stretch;overflow-x:auto;padding:2px 0}

.sg .g .v{color:var(--g)}.sg .b .v{color:var(--b)}.sg .w .v{color:var(--w)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}

td{padding:7px 8px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
td.l{text-align:start;white-space:normal}td small{display:block;color:var(--mut);font-size:11px}
.tg{color:var(--g);font-weight:700}.tb{color:var(--b);font-weight:700}.tw2{color:var(--w);font-weight:700}
tr.tot td{background:var(--soft);font-weight:800}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:760px){.fg{grid-template-columns:repeat(4,1fr)}}
.s2{grid-column:span 2}.s4{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:12.5px;font-weight:700;color:var(--mut)}
input[type=text],input[type=date],input[type=password],select,textarea{width:100%;border:2px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--soft);color:var(--ink)}

label.gd input{border-color:#a7f3d0}label.bd input{border-color:#fecdd3}label.wd input{border-color:#fde68a}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.pv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.pv div{background:var(--soft);border-radius:11px;padding:6px 10px}.pv .l{font-size:11.5px;color:var(--mut);font-weight:700}.pv .v{font-size:17px;font-weight:800}
.pv .neg{background:#fff1f2;color:#be123c}
.empty{padding:24px;text-align:center;color:var(--mut);background:var(--soft);border-radius:12px;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.md{background:var(--card);border-radius:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:20px}.md.wide{max-width:900px}
.md h3{margin:0 0 12px}

#toast.on{opacity:1;transform:translateX(-50%)}#toast.err{background:#be123c}#toast.ok{background:#047857}
.mcard{background:var(--soft);border-radius:12px;padding:10px;display:grid;gap:4px;border-top:4px solid var(--acc)}
.mcard b{font-size:14px}
.modes{display:grid;gap:8px}.modes label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;background:var(--soft)}
.modes input{width:auto;margin-top:5px}.modes label:has(input:checked){border-color:var(--acc);background:#eef2ff;color:#1e1b4b}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:3px 10px;border-radius:8px;font-weight:700;color:var(--mut)}.seg button.on{background:var(--card);color:var(--acc)}
.ltr{direction:ltr;unicode-bidi:embed}
svg.ch{width:100%;height:auto;direction:ltr}svg.ch text{fill:var(--mut);font-size:11px}
@media print{header,.tabs,.acts,.noprint,#toast{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<header><div class="wrap hd">
 <div><h1>🏭 متابعة طباعة المشروعات المختلفة</h1><p>تتبع أوامر الفئات الجديدة من أول مرحلة طباعة حتى التسليم للتشطيب (سليم · معيب · تالف)</p></div>
 <div class="tools" id="tools"></div>
</div></header>
<div class="wrap"><nav class="tabs" id="tabs"></nav></div>
<main class="wrap" id="view"></main>
<div id="mroot"></div><div id="toast"></div>
<input type="file" id="fin" accept=".json,application/json" hidden>

<script>
"use strict";
/* ================== إعدادات ==================
 اتركها فاضية = يعمل محلياً على الجهاز.  للمزامنة بين الأجهزة اكتب إعدادات Firebase (Realtime Database + Auth بالبريد). */
const CFG={DB_URL:"https://printtrack-584d4-default-rtdb.firebaseio.com",API_KEY:"AIzaSyCSdbZuhC1aXHGqywUG5t27mrb_d3v1bvQ",DOMAIN:"@printtrack.app",ROOT:"printtrack"};
/* مهم عند تفعيل المزامنة: مفتاح الـ API داخل الملف ظاهر لأي حد يفتحه، فالحماية الحقيقية من قواعد Realtime Database. القواعد المقترحة (تمنع أي حد غير مسجل من القراءة أو الكتابة):
 { "rules": { "printtrack": { ".read": "auth != null", ".write": "auth != null" } } }
 ملحوظة الصلاحيات: المشغل/المشرف/مدير النظام بتتطبق جوه الواجهة هنا. حذف مستخدم من البرنامج بيلغي دخوله فعلياً، بس حسابه بيفضل موجوداً في Authentication. الحماية الكاملة على مستوى قاعدة البيانات محتاجة Admin SDK (custom claims) وده شغل سيرفر. */
const CLOUD=!!(CFG.DB_URL&&CFG.API_KEY);
const LS="ptrack_v2",RP="ptrack_restore_v2";

/* ================== أدوات ================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey=()=>ymd(new Date());
const fmtDate=s=>{const p=String(s||"").split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:s||""};
const fmtTs=i=>{try{const d=new Date(i);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())}catch(e){return""}};
const normD=s=>String(s==null?"":s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const num=v=>{const n=parseFloat(normD(v).replace(/[,،٬\s]/g,""));return isNaN(n)?0:n};
const pn=v=>{const s=normD(v).replace(/[,،٬\s]/g,"");if(s==="")return 0;return/^\d+$/.test(s)?Number(s):NaN};
const fmt=n=>Number(n||0).toLocaleString("en-US");
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const safeKey=s=>String(s).replace(/[^A-Za-z0-9]+/g,"_");
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const addDays=(s,n)=>{const p=s.split("-");return ymd(new Date(+p[0],+p[1]-1,+p[2]+n))};
const daysBetween=(a,b)=>{const p=s=>{const x=s.split("-");return Date.UTC(+x[0],+x[1]-1,+x[2])};return Math.round((p(b)-p(a))/864e5)};
const pct=(a,b)=>b>0?Math.round(a/b*1000)/10:0;
let toastT;
function toast(m,t){const e=$("toast");e.textContent=m;e.className="on "+(t||"");clearTimeout(toastT);toastT=setTimeout(()=>e.className="",t==="err"?4200:2200)}

/* ================== الثوابت ================== */
const LINES={1:["Super Simultan 1","Super Orlof Intaglio 1","Super Orlof Intaglio 2","Nota screen 1","Check Numero Protecta 1"],
 2:["Simultan 2","Intaglio 3","Intaglio 4","Nota screen 2","Check Numero Protecta 2"],
 3:["Super Simultan 3","Super Orlof Intaglio 5","Super Orlof Intaglio 6","Opti Nota 1","Check Numero Protecta 3"],
 4:["Simultan 4","Intaglio 7","Intaglio 8","Check Numero Protecta 4"]};
const STD={sim:{n:"سيمولتان (أوفست)"},io:{n:"إنتاليو ظهر"},ie:{n:"إنتاليو وجه"},nota:{n:"نوتا سكرين"},num:{n:"ترقيم"}};
const SEQ=["sim","io","ie","nota","num"];
function machType(n){n=String(n||"");if(/simultan/i.test(n))return"sim";const m=n.match(/intaglio\s*(\d+)/i);if(m)return(+m[1])%2?"io":"ie";if(/nota/i.test(n))return"nota";if(/numero/i.test(n))return"num";return""}
const machFor=(ln,t)=>(LINES[ln]||[]).find(m=>machType(m)===t)||"";
const ROLES={operator:"مشغل",supervisor:"مشرف",admin:"مدير النظام"};
const MODES={gbw:{n:"سليم + معيب + تالف",f:["g","b","w"]},gw:{n:"سليم + تالف فقط",f:["g","w"]},bw:{n:"معيب + تالف فقط",f:["b","w"]}};
const MST={active:"🟢 نشط",stopped:"🔴 متوقف",setup:"🟠 إعداد فئة",maint:"🔧 صيانة",broken:"⛔ عطل"};
const STL={waiting:"⏳ بالانتظار",running:"▶️ تعمل",done:"✔ منتهية"};
const STI={waiting:"⏳",running:"▶️",done:"✔"};
const SLOTS=["يومي","12 ظهراً","3 عصراً","5 مساءً","8 مساءً"];
const DEFECT_WARN=15,WASTE_WARN=3;

/* ================== الحالة والحفظ ================== */
let S=blank(),me=null,tok=null,pending={},timer=null,writing=false;
let VIEW="dash",CUR=null,EDIT=null,FILT={q:"",st:"active"},MLINE=3,CH=14;
function blank(){return{v:2,denoms:{},orders:{},mach:{},maint:{},att:{},users:{},handover:"",handoverAt:"",handoverBy:"",log:{},updatedAt:"",lastBackup:""}}
function norm(d){const s=Object.assign(blank(),d||{});["denoms","orders","mach","maint","att","users","log"].forEach(k=>{if(!s[k]||typeof s[k]!=="object")s[k]={}});
 Object.keys(s.orders).forEach(k=>{const o=s.orders[k];if(!o){delete s.orders[k];return}o.id=k;["stages","entries","rcv","deliv"].forEach(x=>{if(!o[x])o[x]={}})});
 Object.keys(s.denoms).forEach(k=>{if(s.denoms[k])s.denoms[k].id=k});return s}
function merge(t,s){for(const k in s){if(s[k]&&typeof s[k]==="object")merge(t[k]=(t[k]&&typeof t[k]==="object")?t[k]:{},s[k]);else t[k]=s[k]}return t}
function flat(o,p="",out={}){for(const k in o){const v=o[k],pp=p?p+"/"+k:k;if(v&&typeof v==="object")flat(v,pp,out);else out[pp]=v}return out}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast("تعذر الحفظ على هذا المتصفح","err")}}
function commit(p){S.updatedAt=new Date().toISOString();if(!CLOUD){save();return}merge(pending,p||{});pending.updatedAt=S.updatedAt;clearTimeout(timer);timer=setTimeout(flush,500)}
const who=()=>me?me.name:"مستخدم محلي";
const can=()=>!CLOUD||!!me;
const canSuper=()=>!CLOUD||(!!me&&(me.role==="supervisor"||me.role==="admin"));
const canAdmin=()=>!CLOUD||(!!me&&me.role==="admin");
function resolveMe(){if(!tok)return false;const un=tok.email.split("@")[0],prof=(S.users||{})[safeKey(un)];if(!prof)return false;me={name:prof.name||un,role:prof.role||"operator"};return true}
function saveRestore(label){try{localStorage.setItem(RP,JSON.stringify({ts:new Date().toISOString(),label,S}))}catch(e){}}
function addLog(m){const k="l"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),e={t:new Date().toISOString(),m,u:who()};S.log[k]=e;const p={log:{[k]:e}};
 const ks=Object.keys(S.log).sort();while(ks.length>150){const o=ks.shift();delete S.log[o];p.log[o]=null}commit(p)}

/* ================== المزامنة (اختيارية) ================== */
const NODE=()=>CFG.DB_URL.replace(/\/$/,"")+"/"+CFG.ROOT;
const sg=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const ss=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}};
function setTok(j){tok={id:j.idToken||j.id_token,refresh:j.refreshToken||j.refresh_token,email:(j.email||(tok&&tok.email)||"").toLowerCase(),exp:Date.now()+(parseInt(j.expiresIn||j.expires_in,10)||3600)*1000-60000};ss("pt_tok",JSON.stringify(tok));me={name:tok.email.split("@")[0]}}
async function getToken(){if(!tok)throw new Error("no");if(Date.now()>tok.exp){const r=await fetch("https://securetoken.googleapis.com/v1/token?key="+CFG.API_KEY,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(tok.refresh)});if(!r.ok)throw new Error("exp");setTok(await r.json())}return tok.id}
async function doLogin(){
 const u=$("lu").value.trim().toLowerCase(),p=$("lp").value,e=$("lerr");
 if(!u||!p){e.textContent="اكتب اسم المستخدم وكلمة المرور";return}
 e.textContent="جاري الدخول…";
 try{const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+CFG.API_KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:(u.includes("@")?u.split("@")[0]:u)+CFG.DOMAIN,password:p,returnSecureToken:true})});
  if(!r.ok){e.textContent="اسم المستخدم أو كلمة المرور غير صحيحة";return}
  setTok(await r.json());await pull();
  if(!Object.keys(S.users||{}).length){closeModal();const nm=window.prompt("أول استخدام للنظام: اكتب اسمك بالعربي — حسابك هيكون مدير النظام")||"";const un2=tok.email.split("@")[0];S.users[safeKey(un2)]={name:nm.trim()||un2,role:"admin",created:new Date().toISOString()};commit({users:S.users})}
  if(!resolveMe()){logout();openModal("<h3>⛔ الحساب غير مفعّل</h3><p>اسم المستخدم ده ملهوش صلاحية دخول. تواصل مع مدير النظام عشان يضيف حسابك.</p><div class='acts'><button class='btn' onclick='closeModal()'>حسناً</button></div>");return}
  closeModal();addLog("تسجيل دخول");render();toast("مرحباً "+me.name,"ok")}
 catch(x){e.textContent="تعذر الاتصال بالإنترنت"}
}
function logout(){tok=null;me=null;ss("pt_tok",null);pending={};S=blank();render()}
async function flush(){
 if(writing||!Object.keys(pending).length)return;if(!tok){pending={};return}
 writing=true;const patch=pending;pending={};
 try{const t=await getToken();const r=await fetch(NODE()+".json?auth="+encodeURIComponent(t),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(flat(patch))});
  if(!r.ok)throw new Error(r.status)}
 catch(e){merge(patch,pending);pending=patch;toast("تعذر الحفظ على السحابة — سنعيد المحاولة","err");clearTimeout(timer);timer=setTimeout(flush,5000)}
 writing=false;if(Object.keys(pending).length){clearTimeout(timer);timer=setTimeout(flush,300)}
}
async function pull(){
 if(!CLOUD||!tok)return;
 try{const t=await getToken(),r=await fetch(NODE()+".json?auth="+encodeURIComponent(t));if(!r.ok)throw new Error(r.status);

const orders=()=>Object.values(S.orders).filter(Boolean);
const stagesOf=o=>Object.keys(o.stages||{}).sort().filter(k=>o.stages[k]).map(k=>Object.assign({k},o.stages[k]));
const entriesOf=o=>Object.keys(o.entries||{}).filter(k=>o.entries[k]).map(k=>Object.assign({id:k},o.entries[k])).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.ts)<String(b.ts)?-1:1);
const delivsOf=o=>Object.keys(o.deliv||{}).filter(k=>o.deliv[k]).map(k=>Object.assign({id:k},o.deliv[k])).sort((a,b)=>a.date<b.date?-1:1);
const rcvOf=o=>Object.keys(o.rcv||{}).filter(k=>o.rcv[k]).map(k=>Object.assign({id:k},o.rcv[k])).sort((a,b)=>a.date<b.date?-1:1);
const stName=s=>(STD[s.type]?STD[s.type].n:"مرحلة")+(s.machine?" — "+s.machine:"");
const rawIn=o=>{const r=rcvOf(o);return r.length?sum(r,x=>x.q||0):num(o.units)};
const modeF=o=>(MODES[o.mode]||MODES.gbw).f;
function chain(o,ents,dels){
 ents=ents||entriesOf(o);dels=dels||delivsOf(o);
 const st=stagesOf(o),t={};st.forEach(s=>t[s.k]={g:0,b:0,w:0});
 ents.forEach(e=>{const x=t[e.stage];if(x){x.g+=e.g||0;x.b+=e.b||0;x.w+=e.w||0}});
 let prev=rawIn(o);const rows=[];
 st.forEach(s=>{const x=t[s.k],used=x.g+x.b+x.w;rows.push({s,in:prev,g:x.g,b:x.b,w:x.w,used,avail:prev-used,out:x.g+x.b});prev=x.g+x.b});
 const last=rows[rows.length-1]||{g:0,b:0,used:0},wasteAll=sum(rows,r=>r.w);
 const dg=sum(dels,d=>d.g||0),db=sum(dels,d=>d.b||0),dw=sum(dels,d=>d.w||0);
 return{rows,last,wasteAll,dg,db,dw,fg:last.g-dg,fb:last.b-db,fw:wasteAll-dw}
}
function validate(o,ents,dels){
 const c=chain(o,ents,dels);
 for(const r of c.rows)if(r.avail<0)return"إجمالي ما عولج في «"+stName(r.s)+"» ("+fmt(r.used)+") أكبر من الوارد إليها ("+fmt(r.in)+")";
 if(c.fg<0)return"السليم المسلَّم للتشطيب أكبر من سليم آخر مرحلة";
 if(c.fb<0)return"المعيب المسلَّم للتشطيب أكبر من معيب آخر مرحلة";
 if(c.fw<0)return"التالف المسلَّم للتشطيب أكبر من إجمالي التالف المسجل";
 return""
}
const curStage=o=>{const s=stagesOf(o);return s.find(x=>x.state!=="done")||null};
function progress(o){const c=chain(o),u=num(o.units);return u>0?Math.min(100,Math.round(c.last.used/u*100)):0}
function place(o){if(o.status==="done")return"✔ مكتمل ومُسلَّم";const c=curStage(o);if(!c)return"🚚 جاهز للتسليم للتشطيب";return"📍 "+stName(c)+" (خط "+c.line+")"}
const isLate=o=>o.status!=="done"&&o.due&&o.due<todayKey();
function denomOf(o){return S.denoms[o.denom]||{name:o.denomName||"—",units:0}}
const dKey=n=>normD(n).trim().replace(/\s+/g," ").toLowerCase();
function findDenom(name){const k=dKey(name);return Object.values(S.denoms).find(d=>d&&dKey(d.name)===k)}
function dailySeries(days){
 const keys=[];for(let i=days-1;i>=0;i--)keys.push(addDays(todayKey(),-i));
 const idx={};keys.forEach((k,i)=>idx[k]=i);const g=keys.map(()=>0),b=g.slice(),w=g.slice();
 orders().forEach(o=>entriesOf(o).forEach(e=>{const i=idx[e.date];if(i!=null){g[i]+=e.g||0;b[i]+=e.b||0;w[i]+=e.w||0}}));
 return{keys,g,b,w}
}

function stackSVG(d){

 const cp=v=>v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?(v/1e3).toFixed(v%1e3?1:0)+"K":String(Math.round(v));
 let s='<svg viewBox="0 0 '+W+" "+H+'" class="ch">';
 for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="currentColor" opacity=".12"/><text x="'+(L-5)+'" y="'+(y+4)+'" text-anchor="end">'+cp(mx*i/4)+"</text>"}
 const gw=iw/n,bw=Math.min(30,gw*.7);
 d.keys.forEach((k,i)=>{const cx=L+gw*(i+.5);let y=T+ih;
  [["g","#059669"],["b","#e11d48"],["w","#d97706"]].forEach(([f,c])=>{const h=ih*d[f][i]/mx;if(h>0){y-=h;s+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+c+'"><title>'+k+" — "+({g:"سليم",b:"معيب",w:"تالف"})[f]+": "+fmt(d[f][i])+"</title></rect>"}});
  if(n<=16||i%2===0)s+='<text x="'+cx.toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+k.slice(8)+"/"+k.slice(5,7)+"</text>"});
 return s+"</svg>"
}

async function addUser(){
 const u=normD($("nu_u").value).trim().toLowerCase().split("@")[0],n=$("nu_n").value.trim(),p=$("nu_p").value,r=$("nu_r").value;
 if(!/^[a-z0-9._-]{3,30}$/.test(u))return ferr("اسم المستخدم: حروف إنجليزية وأرقام فقط (٣ أحرف على الأقل)");
 if(!n)return ferr("اكتب الاسم بالعربي");if(p.length<6)return ferr("كلمة المرور ٦ أحرف على الأقل");
 if(!ROLES[r])return ferr("اختر الصلاحية");if(S.users[safeKey(u)])return ferr("اسم المستخدم مسجل بالفعل");
 ferr("جاري الإنشاء…");
 try{const res=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+CFG.API_KEY,{method:"POST","headers":{"Content-Type":"application/json"},body:JSON.stringify({email:u+CFG.DOMAIN,password:p,returnSecureToken:true})});
  if(!res.ok){const j=await res.json().catch(()=>({}));const m=j&&j.error&&j.error.message;return ferr(m==="EMAIL_EXISTS"?"اسم المستخدم مسجل بالفعل في نظام الدخول":"تعذر إنشاء الحساب — تحقق من الإنترنت")}
  const prof={name:n,role:r,created:new Date().toISOString(),by:who()};S.users[safeKey(u)]=prof;commit({users:{[safeKey(u)]:prof}});addLog("مستخدم جديد: "+n+" ("+ROLES[r]+")");usersModal();toast("تمت إضافة "+n+" ✓","ok")}
 catch(x){ferr("تعذر الاتصال بالإنترنت")}
}
function setRole(k,r){if(!canAdmin()||!ROLES[r]||!S.users[k])return;S.users[k].role=r;commit({users:{[k]:{role:r}}});addLog("تغيير صلاحية "+(S.users[k].name||k)+" إلى "+ROLES[r]);toast("تم حفظ الصلاحية ✓","ok")}
function delUser(k){if(!canAdmin()||!S.users[k])return;const nm=S.users[k].name||k;confirmBox("حذف صلاحية "+nm+"؟ مش هيقدر يدخل البرنامج بعدها.",()=>{delete S.users[k];commit({users:{[k]:null}});addLog("حذف صلاحية "+nm);usersModal();toast("تم الحذف ✓","ok")},"حذف")}
function pwModal(){openModal("<h3>🔑 تغيير كلمة المرور</h3><div class='fg' style='grid-template-columns:1fr'><label class='f'>كلمة المرور الجديدة<input type='password' id='pw1' class='ltr' autocomplete='new-password'></label></div><div class='err' id='ferr'></div><div class='acts'><button class='btn' onclick='changePw()'>حفظ</button><button class='btn l' onclick='closeModal()'>إلغاء</button></div>")}
async function changePw(){
 const p=$("pw1").value;if(p.length<6)return ferr("كلمة المرور ٦ أحرف على الأقل");
 try{const t=await getToken();const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:update?key="+CFG.API_KEY,{method:"POST","headers":{"Content-Type":"application/json"},body:JSON.stringify({idToken:t,newPassword:p,returnSecureToken:true})});
  if(!r.ok)return ferr("تعذر التغيير — سجل خروج وادخل من جديد وجرب");setTok(await r.json());closeModal();addLog("تغيير كلمة المرور");toast("تم تغيير كلمة المرور ✓","ok")}
 catch(x){ferr("تعذر الاتصال بالإنترنت")}
}

/* ================== بدء التشغيل ================== */
(async function start(){
 if(CLOUD){
  try{const t=JSON.parse(sg("pt_tok")||"null");if(t&&t.refresh){tok=t;me={name:String(t.email||"").split("@")[0]}}}catch(e){}
  render();if(tok){await pull();if(tok&&!resolveMe()){logout();openModal("<h3>⛔ الحساب غير مفعّل</h3><p>تواصل مع مدير النظام عشان يضيف حسابك.</p><div class='acts'><button class='btn' onclick='closeModal()'>حسناً</button></div>");return}render();if(me)toast("مرحباً "+me.name,"ok")}
  setInterval(async()=>{if(tok&&!writing&&!Object.keys(pending).length){await pull();if(!typing())render()}},12000)
 }else{
  try{const s=localStorage.getItem(LS);if(s)S=norm(JSON.parse(s))}catch(e){S=blank()}
  render()
 }
})();
</script>
